[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-chain"
version = "0.1.0"
description = "Generator for physical sequences of linked chess puzzles"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chess Chain Contributors" }]
dependencies = [
    "chess>=1.10",
    "zstandard>=0.23",
    "pyarrow>=18.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
chess-chain = "chess_chain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_chain"]

[tool.hatch.build.targets.sdist]
include = ["src/chess_chain", "config", "docs", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chess_chain"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "chess.*",
    "zstandard.*",
    "polars.*",
    "duckdb.*",
    "pyarrow.*",
    "scipy.*",
]
ignore_missing_imports = true
