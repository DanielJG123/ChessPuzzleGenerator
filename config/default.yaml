# Paths are resolved relative to the project root unless absolute.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  samples: data/samples

ingest:
  # Official Lichess puzzle export (CC0); see https://database.lichess.org/#puzzles
  lichess_puzzle_url: https://database.lichess.org/lichess_db_puzzle.csv.zst
  lichess_puzzle_filename: lichess_db_puzzle.csv.zst
  download_chunk_size: 1048576
  download_space_margin_bytes: 67108864

  # Stage 2 ingestion pipeline settings.
  # Number of source rows between checkpoints/log lines during `db ingest`.
  ingest_batch_size: 50000
  # Parquet row groups are flushed after this many buffered records.
  parquet_row_group_rows: 65536
  # Rating bucket partition width for `db ingest` (hive partition column).
  rating_bucket_width: 100
  # Bump when the derivation or schema changes so old outputs are invalidated.
  transform_version: 1

analysis:
  # Reserved for later stages (ingest, similarity, sequence search).
  default_sample_rows: 10000

  # Stage 3 analysis tiers. "cheap" needs no engine; "deep"/"variation"/
  # "final_collision" may require an external UCI engine executable.
  engine:
    # Path to a Stockfish-compatible UCI executable. Empty string means "not
    # configured": cheap analysis still works, engine tiers fail with a clear
    # message. The binary is never vendored into the repository.
    path: ""
    threads: 1
    hash_mb: 64
    movetime_ms: 500
    depth: null
    nodes: null
    multipv: 4

  # Named forcedness thresholds (versioned: bump when the semantics change so
  # cached deep analysis is invalidated).
  forcedness:
    version: 1
    # Gap (centipawns) above which the intended move is "uniquely best".
    unique_best_gap_cp: 50
    # Gap above which every alternative is "decisively worse".
    practically_forced_gap_cp: 200
    # Score used to represent mate ("mate_value_cp - plies").
    mate_value_cp: 10000
    # Moves within this gap of the best move count as "plausible".
    plausible_gap_cp: 30

  # Bounded accepted-line enumeration for terminal-variation analysis.
  variations:
    default_max_plies: 8
    default_max_nodes: 20000
    default_acceptance: intended_only

  # Lazy final-only occupancy-collision analysis.
  collision:
    analyser_version: 1
    default_scope: up_to_plies
    default_max_depth: 12
    default_max_nodes: 100000

# Stage 4 puzzle similarity organiser. Retrieval is bounded: candidates are
# filtered by rating band and quality constraints, grouped by piece count and
# material signature, queried by nearest occupancy mask within groups, and only
# a shortlist receives the exact per-endpoint piece-assignment analysis.
# Bump `version` whenever the semantics change so stale indexes are detected.
similarity:
  version: 1
  # Backend used for nearest-occupancy queries: "exact" (NumPy bitwise_count)
  # or "accelerated" (SciPy cdist over unpacked bits; optional, same results).
  backend: exact
  default_top_k: 50
  # Product-quality constraints applied before grouping.
  max_rating_deviation: 200
  min_popularity: 0
  # Candidate piece-count window around the source's available piece count.
  piece_count_tolerance: 4
  # Hard cap on the number of candidate rows scanned per query (bounded work).
  max_candidates_scanned: 200000
  # Occupancy-nearest shortlist multiplier (top_k * this) before exact scoring.
  shortlist_multiplier: 4
  # Product configuration: reject transitions that must establish non-visible
  # castling/en-passant rights (the occupancy-only checker cannot verify them).
  reject_non_visible_rights: false
  # Exclude puzzles whose start material needs surplus pieces beyond a set.
  exclude_unusual_material: false
  # Conservative whole-board transformations, tried in this order. Every
  # transformed candidate is reconstructed and validated with python-chess.
  symmetries: [identity, file_reflection, rank_reflection, rot180]
  # Cost weights inside the minimum-cost physical piece assignment.
  cost_weights:
    move: 1.0
    add: 3.0
    remove: 2.0
  # Decomposable transition-complexity score weights (lower is better).
  score_weights:
    occupancy_best: 3.0
    occupancy_mean: 1.5
    occupancy_worst: 0.5
    cost_best: 1.0
    cost_mean: 0.5
    cost_worst: 0.25
    swap: 1.0
    replace: 4.0
    branch: 2.0
    symmetry_non_identity: 3.0
    rights_annotation: 5.0
    inventory_invalid: 20.0

# Stage 5 deterministic transition language and synthesiser. No LLM ever
# invents executable transition instructions: a typed AST is executed and
# verified, then rendered from templates. Bump `version` when semantics change.
transition:
  version: 1
  # Bounded synthesis: at most this many actions per candidate program.
  default_max_actions: 4
  # Plausible-line generator used for anchor uncertainty and wrong states.
  plausible_depth: 2
  plausible_node_cap: 2000
  # Minimum anchor uncertainty (bits) and number of independent anchors.
  min_anchor_uncertainty_bits: 0.0
  min_independent_anchors: 1
  # Product configuration.
  allow_absolute_square_fallback: true
  allow_establish_rights: true
  reject_collapsing_reveal: true
  # Player-facing global rule (configurable, not assumed final).
  global_rule_wording: >-
    Continue choosing the strongest move for each side until checkmate occurs
    or the stated transition condition becomes uniquely applicable.
